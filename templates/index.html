<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoGuesser</title>
<link rel="icon" type="image/png" sizes="64x64" href="/static/icons/geoguesser-pin-white-64.png">
<link rel="icon" type="image/png" sizes="128x128" href="/static/icons/geoguesser-pin-white-128.png">
<link rel="icon" type="image/png" sizes="256x256" href="/static/icons/geoguesser-pin-white-256.png">
<link rel="apple-touch-icon" href="/static/icons/geoguesser-pin-white-180.png">
<link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet">
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #0f172a;
    --panel: rgba(255, 255, 255, .92);
    --accent: #2563eb;
    --accent-hi: #1d4ed8;
    --shadow: 0 10px 40px rgba(0, 0, 0, .45);
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  * { box-sizing: border-box; }
  /* any rule that sets `display` beats the UA's [hidden] rule -- force it */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
               font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }

  /* z-index 0 gives the viewer its own stacking context, keeping it under the UI */
  #street { position: absolute; inset: 0; z-index: 0; background: #111; }

  #brand { position: absolute; top: 16px; left: 16px; z-index: 600;
           display: flex; align-items: center; gap: 8px;
           padding: 8px 14px; border-radius: 999px;
           background: var(--panel); backdrop-filter: blur(8px);
           box-shadow: var(--shadow); font-weight: 650; letter-spacing: -.01em; }
  #brand small { font-weight: 500; opacity: .55; }
  #brand b { padding-left: 12px; margin-left: 4px; font-variant-numeric: tabular-nums;
             border-left: 1px solid rgba(15, 23, 42, .15); }
  #quitBtn { margin-left: 10px; padding: 5px 12px; font-size: 13px; border-radius: 8px;
             background: rgba(15, 23, 42, .07); color: var(--ink); opacity: .65; }
  #quitBtn:hover { background: #fee2e2; color: #b91c1c; opacity: 1; }

  /* start screen, sits over everything until the first round */
  #start { position: absolute; inset: 0; z-index: 900; display: flex;
           flex-direction: column; align-items: center; justify-content: center; gap: 4px;
           text-align: center; color: #fff; overflow: hidden;
           background: radial-gradient(ellipse at center, #1e293b, #020617); }
  #start video { position: absolute; inset: 0; z-index: -2;
                 width: 100%; height: 100%; object-fit: cover; }
  /* scrim over the footage so the title stays readable */
  #start::before { content: ''; position: absolute; inset: 0; z-index: -1;
                   background: radial-gradient(ellipse at center,
                               rgba(2, 6, 23, .35), rgba(2, 6, 23, .85)); }
  #start.gone { display: none; }
  #logo { width: clamp(64px, 11vw, 92px); margin-bottom: 6px;
          filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .5)); }
  #start h1 { margin: 0; font-size: clamp(34px, 7vw, 62px); font-weight: 750;
              letter-spacing: -.03em; }
  #start p { margin: 10px 0 26px; opacity: .6; line-height: 1.5; }
  #startBtn { padding: 14px 44px; font-size: 17px; border-radius: 11px; }
  #final { margin-bottom: 22px; font-size: 15px; opacity: .8; }
  #final b { font-size: 26px; font-weight: 750; display: block; margin-top: 4px; }
  #standings { margin-top: 12px; padding-top: 12px; text-align: left;
               border-top: 1px solid rgba(255, 255, 255, .15);
               display: grid; gap: 6px; min-width: 240px; }
  #standings li { display: flex; justify-content: space-between; gap: 20px;
                  list-style: none; font-variant-numeric: tabular-nums; }
  #standings li.you { font-weight: 700; }
  #standings .rounds { opacity: .45; font-size: 12px; }

  /* mode picker: single player on the left, multiplayer on the right */
  #sheet { width: min(880px, 92vw); margin-top: 24px; text-align: left;
           display: none; gap: 16px;
           grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  #sheet.show { display: grid; }
  #sheet section { display: flex; flex-direction: column; gap: 10px;
                   padding: 16px; border-radius: 14px;
                   background: rgba(2, 6, 23, .35);
                   border: 1px solid rgba(255, 255, 255, .1); }
  h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; opacity: .5;
       letter-spacing: .08em; text-transform: uppercase; }

  #nameRow { display: flex; flex-direction: column; gap: 6px; font-size: 12px;
             font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
             opacity: .75; }
  #nameInput { padding: 11px 13px; border-radius: 10px; font: 600 15px/1 inherit;
               letter-spacing: normal; text-transform: none; color: #fff;
               background: rgba(255, 255, 255, .08);
               border: 1px solid rgba(255, 255, 255, .2); }
  #nameInput::placeholder { color: rgba(255, 255, 255, .3); }
  #nameInput:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* join by code */
  #joinForm { display: flex; flex-wrap: wrap; gap: 8px; }
  #codeInput { flex: 1; min-width: 140px; padding: 13px 14px; border-radius: 10px;
               font: 600 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
               letter-spacing: .12em; text-transform: uppercase; color: #fff;
               background: rgba(255, 255, 255, .08);
               border: 1px solid rgba(255, 255, 255, .2); }
  #codeInput::placeholder { color: rgba(255, 255, 255, .3); letter-spacing: .12em; }
  #codeInput:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #joinErr { flex-basis: 100%; min-height: 16px; font-size: 12px; color: #fca5a5; }

  /* code hand-off screen */
  #share { width: min(460px, 92vw); margin-top: 24px; padding: 22px;
           border-radius: 16px; background: rgba(2, 6, 23, .5);
           border: 1px solid rgba(255, 255, 255, .12); }
  #codeBox { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #codeText { flex: 1; padding: 14px 16px; border-radius: 11px;
              font: 700 clamp(20px, 4vw, 28px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
              letter-spacing: .16em; text-align: center;
              background: rgba(255, 255, 255, .1);
              border: 1px dashed rgba(255, 255, 255, .3); }
  #shareNote { margin: 0 0 18px; font-size: 13px; opacity: .55; }
  #playBtn { width: 100%; padding: 13px; }
  .mode { display: block; width: 100%; padding: 14px 18px; text-align: left;
          border-radius: 12px; background: rgba(255, 255, 255, .1);
          border: 1px solid rgba(255, 255, 255, .16); color: #fff; }
  .mode:hover:not(:disabled) { background: rgba(255, 255, 255, .18); }
  .mode small { display: block; margin-top: 3px; font-weight: 400; opacity: .6; }
  #opts { display: flex; flex-wrap: wrap; gap: 8px; }
  #opts button { flex: 1; min-width: 84px; padding: 13px 6px; }
  #back { align-self: flex-start; margin-top: 2px; padding: 6px 0;
          background: none; color: #fff; opacity: .5; font-weight: 500; }
  #back:hover { opacity: .9; background: none; }

  /* difficulty picker: same dark cards as the mode sheet */
  #diff { width: min(520px, 92vw); margin-top: 24px; text-align: left;
          display: flex; flex-direction: column; gap: 12px; }
  #diffCards { display: grid; gap: 10px; }
  #diffCards .mode b { font-size: 15px; letter-spacing: .04em; }
  #areaPick { display: flex; flex-wrap: wrap; gap: 8px; }
  #areaSelect { flex: 1; min-width: 180px; padding: 12px 14px; border-radius: 10px;
                font: 600 15px/1 inherit; color: #fff; cursor: pointer;
                background: rgba(255, 255, 255, .08);
                border: 1px solid rgba(255, 255, 255, .2); }
  #areaSelect:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* the native dropdown list paints on a light background */
  #areaSelect option, #areaSelect optgroup { color: #0f172a; }
  #diffBack { align-self: flex-start; margin-top: 2px; padding: 6px 0;
              background: none; color: #fff; opacity: .5; font-weight: 500; }
  #diffBack:hover { opacity: .9; background: none; }

  /* live scoreboard, multiplayer only */
  #board { position: absolute; top: 16px; right: 16px; z-index: 600;
           min-width: 200px; padding: 12px 14px; border-radius: 14px;
           background: var(--panel); backdrop-filter: blur(8px);
           box-shadow: var(--shadow); font-size: 14px; }
  #board h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; opacity: .45;
              letter-spacing: .08em; text-transform: uppercase; }
  #board h3 span { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                   letter-spacing: .1em; }
  #boardList { margin: 0; padding: 0; list-style: none;
               display: grid; gap: 5px; }
  #boardList li { display: flex; justify-content: space-between; gap: 18px;
                  font-variant-numeric: tabular-nums; }
  #boardList li.you { font-weight: 700; color: var(--accent); }
  #boardList .rounds { opacity: .4; font-size: 12px; font-weight: 400; }

  #panel { position: absolute; right: 16px; bottom: 16px; width: 380px; height: 300px;
           z-index: 500; display: flex; flex-direction: column; overflow: hidden;
           border-radius: 14px; background: var(--panel); backdrop-filter: blur(8px);
           box-shadow: var(--shadow);
           transition: width .35s var(--ease), height .35s var(--ease),
                       inset .35s var(--ease), border-radius .35s var(--ease); }
  /* peek larger on hover, the way you'd expect while aiming a guess */
  #panel:not(.expanded):hover { width: 480px; height: 380px; }
  #panel.expanded { inset: 0; width: auto; height: auto; border-radius: 0; }

  #map { flex: 1; min-height: 0; cursor: crosshair; background: #dfe3e8; }
  #panel.expanded #map { cursor: grab; }

  #bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
         border-top: 1px solid rgba(15, 23, 42, .08); }
  #panel.expanded #bar { display: none; }
  #status { flex: 1; font-size: 13px; opacity: .7; }

  button { font: inherit; font-weight: 600; padding: 9px 18px; cursor: pointer;
           border: 0; border-radius: 9px; color: #fff; background: var(--accent);
           transition: background .15s, transform .15s, opacity .15s; }
  button:hover:not(:disabled) { background: var(--accent-hi); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* result card, only while the map is expanded */
  #result { position: absolute; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
            z-index: 700; display: none; gap: 18px; align-items: center;
            padding: 16px 18px 16px 24px; border-radius: 16px;
            background: var(--panel); backdrop-filter: blur(8px); box-shadow: var(--shadow);
            opacity: 0; transition: opacity .3s var(--ease) .15s, transform .3s var(--ease) .15s; }
  #result.show { display: flex; opacity: 1; transform: translate(-50%, 0); }
  #dist { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1;
          white-space: nowrap; }
  #dist small { display: block; margin-top: 5px; font-size: 12px; font-weight: 500;
                letter-spacing: .06em; text-transform: uppercase; opacity: .5; }
  #km { padding-left: 18px; border-left: 1px solid rgba(15, 23, 42, .12);
        font-size: 22px; font-weight: 650; letter-spacing: -.01em; line-height: 1;
        white-space: nowrap; opacity: .75; }
  #km small { display: block; margin-top: 5px; font-size: 12px; font-weight: 500;
              letter-spacing: .06em; text-transform: uppercase; opacity: .6; }

  /* name pinned to the middle of each guess line */
  .leaflet-tooltip.line-label { padding: 3px 9px; border: 0; border-radius: 7px;
                                background: rgba(245, 158, 11, .95); color: #fff;
                                font-size: 12px; font-weight: 650; white-space: nowrap;
                                box-shadow: 0 1px 5px rgba(0, 0, 0, .35); }
  .leaflet-tooltip.line-label.mine { background: rgba(37, 99, 235, .95); }
  .leaflet-tooltip.line-label::before { display: none; }   /* no callout arrow */

  .spin { width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px;
          display: inline-block; border: 2px solid rgba(15, 23, 42, .2);
          border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    #panel:not(.expanded), #panel:not(.expanded):hover { left: 16px; width: auto; height: 240px; }
  }
</style>

<div id="street"></div>
<div id="brand">GeoGuesser <small>360&deg;</small>
  <b id="score">0</b><b id="progress"></b>
  <button id="quitBtn" hidden>Quit</button></div>

<div id="start">
  <!-- muted + playsinline are what let browsers autoplay it at all -->
  <video src="/static/earth.mp4" autoplay muted loop playsinline></video>
  <img id="logo" src="/static/icons/geoguesser-pin-white-256.png" alt="">
  <h1>GeoGuesser <span style="opacity:.5">360&deg;</span></h1>
  <p>One street. One guess. Anywhere on Earth.</p>
  <div id="final" hidden></div>
  <button id="startBtn">Start game</button>

  <div id="sheet">
    <section id="solo">
      <h2 id="soloTitle">Single player</h2>
      <button class="mode" data-mode="time">Time Attack
        <small>Score as much as you can before the clock runs out</small></button>
      <button class="mode" data-mode="rounds">Fixed Rounds
        <small>A set number of guesses, then a final score</small></button>
      <div id="opts" hidden></div>
      <button id="back" hidden>&larr; Back</button>
    </section>

    <section id="multi">
      <h2>Multiplayer</h2>
      <label id="nameRow">Your name
        <input id="nameInput" maxlength="20" autocomplete="off" placeholder="Player 1">
      </label>
      <button class="mode" id="createBtn">Create game
        <small>10 rounds &mdash; share the code with your friends</small></button>
      <button class="mode" id="joinBtn">Join game
        <small>Enter a code you were given</small></button>
      <form id="joinForm" hidden>
        <input id="codeInput" maxlength="10" autocomplete="off" spellcheck="false"
               placeholder="ABCD123XYZ" aria-label="Game code">
        <button type="submit">Join</button>
        <div id="joinErr"></div>
      </form>
    </section>
  </div>

  <div id="share" hidden>
    <h2>Share this code</h2>
    <div id="codeBox"><span id="codeText"></span><button id="copyBtn">Copy</button></div>
    <p id="shareNote">A 10-round match. Everyone gets the same locations, and
       the next street only loads once everyone has guessed.</p>
    <button id="playBtn">Start playing</button>
  </div>

  <div id="diff" hidden>
    <h2>Choose a difficulty</h2>
    <div id="diffCards">
      <button class="mode" data-diff="easy"><b>EASY</b>
        <small>Choose a Country</small></button>
      <button class="mode" data-diff="medium"><b>MEDIUM</b>
        <small>Choose a Continent</small></button>
      <button class="mode" data-diff="hard"><b>HARD</b>
        <small>Whole World</small></button>
    </div>
    <div id="areaPick" hidden>
      <select id="areaSelect" aria-label="Country or continent"></select>
      <button id="areaGo">Start game</button>
    </div>
    <button id="diffBack">&larr; Back</button>
  </div>
</div>

<div id="board" hidden>
  <h3>Game <span id="boardCode"></span></h3>
  <ol id="boardList"></ol>
</div>

<div id="panel">
  <div id="map"></div>
  <div id="bar">
    <span id="status"></span>
    <button id="guess" disabled>Guess</button>
  </div>
</div>

<div id="result">
  <div id="dist">&mdash;<small>points</small></div>
  <div id="km">&mdash;<small>off target</small></div>
  <button id="next">Next round</button>
</div>

<script>
const token = {{ token|tojson }};
const panel = document.getElementById('panel');
const result = document.getElementById('result');
const distEl = document.getElementById('dist');
const kmEl = document.getElementById('km');

// metres read better than "0.4 km" for a near miss
function fmt(km) {
  return km < 1 ? Math.round(km * 1000) + ' m' : Math.round(km).toLocaleString() + ' km';
}
const statusEl = document.getElementById('status');
const guessBtn = document.getElementById('guess');

const map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([25, 0], 2);
L.control.zoom({ position: 'topright' }).addTo(map);
// Esri World Street Map: Latin/English labels worldwide, no API key.
// ponytail: OSM's standard tiles label in the local script (Arabic in Egypt, etc).
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri', maxZoom: 19 }).addTo(map);

// put a point on whichever world copy is nearest the reference, so lines take
// the short way across the antimeridian instead of wrapping right around
function near(ref, lat, lng) {
  if (Math.abs(lng - ref.lng) > 180) lng += ref.lng > lng ? 360 : -360;
  return L.latLng(lat, lng);
}

function pin(color) {
  return L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color +
          ';border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
}

const scoreEl = document.getElementById('score');
const quitBtn = document.getElementById('quitBtn');

// built once, up front: a viewer constructed with an imageId doesn't paint its
// first frame until some input event wakes the render loop. moveTo() always does.
const viewer = new mapillary.Viewer({
  accessToken: token,
  container: 'street',
  component: { sequence: false }   // drops the play/pause sequence bar
});
window.addEventListener('resize', function () { viewer.resize(); });

let layers = [], picked = null, over = false;

// the panel animates for 350ms; Leaflet has to be told its box changed
function resize(then) {
  setTimeout(function () { map.invalidateSize(); if (then) then(); }, 380);
}

function setStatus(text, busy) {
  statusEl.innerHTML = (busy ? '<span class="spin"></span>' : '') + text;
}

map.on('click', function (e) {
  if (over) return;                       // already guessed, waiting for Next
  picked = e.latlng.wrap();               // the map repeats; keep lng in +/-180
  if (layers[0]) layers[0].setLatLng(picked);
  else layers[0] = L.marker(picked, { icon: pin('#2563eb') }).addTo(map);
  guessBtn.disabled = false;
  setStatus('Locked in? Hit Guess.');
});

let loading = false;   // guards against two rounds loading over each other

// MapillaryJS rejects moveTo with a Cancel/Abort error when the player walks or
// drags before it settles. The viewer is then already on a valid image, so that
// is not a failure -- retrying it used to pull a whole new location mid-round.
function sleep(ms) {
  return new Promise(function (r) { setTimeout(r, ms); });
}

function navAborted(err) {
  const name = (err && (err.name || (err.constructor || {}).name)) || '';
  return /cancel|abort/i.test(name);
}

async function newRound(tries) {
  tries = tries || 0;
  if (loading && !tries) return;
  loading = true;
  try {
    layers.forEach(function (l) { map.removeLayer(l); });
    layers = [];
    actualPoint = null;
    actualTrue = null;
    drawnGuesses = {};
    picked = null;
    over = false;
    guessBtn.disabled = true;
    stopClock();                 // loading a street is on the house
    result.classList.remove('show');
    panel.classList.remove('expanded');
    map.setView([25, 0], 2);
    resize();
    setStatus('Finding a street&hellip;', true);

    let d;
    try {
      d = await (await fetch('/api/round')).json();
    } catch (err) {
      d = { error: 'network error' };
    }
    if (d.error) {
      // Mapillary 5xx's in bursts; the server says when it is worth retrying
      if (d.retry && tries < 3) {
        setStatus('Mapillary is busy, retrying&hellip;', true);
        await sleep(1500 * (tries + 1));
        loading = false;
        return newRound(tries + 1);
      }
      setStatus(d.error);
      return;
    }

    try {
      await viewer.moveTo(d.image_id);
    } catch (err) {
      if (!navAborted(err)) {
        // a dud image, or Mapillary erroring on its image endpoint. Pause
        // before retrying, since hammering a struggling API just fails faster.
        if (tries < 3) {
          setStatus('That street would not load, trying another&hellip;', true);
          await sleep(1200 * (tries + 1));
          loading = false;
          return newRound(tries + 1);
        }
        setStatus('could not load a street, please reload');
        return;
      }
    }
    viewer.resize();
    setStatus('Look around, then click the map.');

    // a hiccup here costs the clock, never the location
    try {
      const t = await (await fetch('/api/resume', { method: 'POST' })).json();
      if (t.over) return endGame();
      startClock(t.seconds_left);
    } catch (err) { /* clock simply stays paused */ }
  } finally {
    loading = false;
  }
}

guessBtn.onclick = async function () {
  guessBtn.disabled = true;
  stopClock();                 // result screen is free time too
  setStatus('Checking&hellip;', true);
  const r = await fetch('/api/guess', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lat: picked.lat, lng: picked.lng })
  });
  const d = await r.json();
  if (d.error) { setStatus(d.error); return; }

  over = true;
  const actual = near(picked, d.actual.lat, d.actual.lng);
  actualPoint = actual;
  actualTrue = L.latLng(d.actual.lat, d.actual.lng);

  layers.push(
    L.marker(actual, { icon: pin('#dc2626') }).addTo(map),
    L.polyline([picked, actual], { color: '#dc2626', weight: 2, dashArray: '6,7' })
      .addTo(map)
      .bindTooltip(code ? 'You &middot; ' + fmt(d.distance_km) : '',
                   { permanent: !!code, direction: 'center',
                     className: 'line-label mine' })
  );
  distEl.innerHTML = '+' + d.points.toLocaleString() + '<small>points</small>';
  kmEl.innerHTML = fmt(d.distance_km) + '<small>off target</small>';
  scoreEl.textContent = d.score.toLocaleString();
  if (mode === 'rounds') progressEl.textContent = d.played + ' / ' + d.limit;
  else stopClock(d.seconds_left);
  nextBtn.dataset.last = d.over ? '1' : '0';
  nextBtn.textContent = d.over ? 'See final score' : 'Next round';
  if (code && d.sync) {
    renderBoard(d.sync);
    drawGuesses(d.sync.guesses);
    showWait(d.sync);
  }

  panel.classList.add('expanded');
  resize(function () {
    map.fitBounds(L.latLngBounds([picked, actual]), { padding: [90, 90], maxZoom: 12 });
    result.classList.add('show');
  });
};

// ------------------------------------------------------------- game modes

const LENGTHS = { time: [5, 10, 15], rounds: [5, 10, 15, 30] };
const startEl = document.getElementById('start');
const sheet = document.getElementById('sheet');
const opts = document.getElementById('opts');
const backBtn = document.getElementById('back');
const finalEl = document.getElementById('final');
const nextBtn = document.getElementById('next');
const progressEl = document.getElementById('progress');

const soloSection = document.getElementById('solo');
const soloTitle = document.getElementById('soloTitle');
const multiSection = document.getElementById('multi');
const joinForm = document.getElementById('joinForm');
const joinErr = document.getElementById('joinErr');
const codeInput = document.getElementById('codeInput');
const shareEl = document.getElementById('share');

const board = document.getElementById('board');
const boardList = document.getElementById('boardList');

const diffEl = document.getElementById('diff');
const areaPick = document.getElementById('areaPick');
const areaSelect = document.getElementById('areaSelect');

let mode = null, deadline = 0, ticker = null, finished = false;
let code = null, poller = null, pendingGame = null, curRound = 0;
let actualPoint = null, actualTrue = null, drawnGuesses = {}, needsRefit = false;
let pendingSolo = null, curDiff = null, regionData = null;

function renderBoard(d) {
  boardList.innerHTML = '';
  d.players.forEach(function (p) {
    const li = document.createElement('li');
    if (p.id === d.you) li.className = 'you';
    li.innerHTML = '<span>' + esc(p.name) + (p.id === d.you ? ' (you)' : '') +
                   (p.guessed ? '' : ' <span class="rounds">guessing\u2026</span>') +
                   '</span><span>' + p.score.toLocaleString() + '</span>';
    boardList.appendChild(li);
  });
}

// opponents appear as they guess -- the server only sends them once you have
// guessed yourself, so nobody can copy a pin
function drawGuesses(list) {
  if (!actualPoint || !list) return;
  let added = false;
  list.forEach(function (g) {
    if (drawnGuesses[g.id]) return;
    const at = near(actualPoint, g.lat, g.lng);
    drawnGuesses[g.id] = true;
    added = true;
    layers.push(
      L.marker(at, { icon: pin('#f59e0b') }).addTo(map)
        .bindTooltip(esc(g.name) + ' &middot; ' + g.points.toLocaleString() + ' pts'),
      L.polyline([at, actualPoint],
        { color: '#f59e0b', weight: 2, opacity: .8, dashArray: '4,7' }).addTo(map)
        .bindTooltip(esc(g.name) + ' &middot; ' + fmt(map.distance(actualTrue, [g.lat, g.lng]) / 1000),
                     { permanent: true, direction: 'center', className: 'line-label' })
    );
    if (!map.getBounds().contains(at)) needsRefit = true;
  });
  // only re-frame when someone landed off-screen, so the view does not jump
  if (added && needsRefit) {
    map.fitBounds(L.featureGroup(layers).getBounds(), { padding: [80, 80], maxZoom: 12 });
    needsRefit = false;
  }
}

// the whole match moves in lockstep: nobody sees the next street until
// everyone has guessed this one and clicked through the result
async function pollSync() {
  if (!code) return null;
  const d = await fetch('/api/sync').then(function (r) { return r.json(); });
  if (d.error) return null;
  renderBoard(d);
  drawGuesses(d.guesses);
  if (d.round !== curRound) { curRound = d.round; newRound(); return d; }
  if (over && !finished) showWait(d);
  return d;
}

function showWait(d) {
  if (nextBtn.dataset.last === '1') return;      // last round, offer the results
  if (!d.you_ready) {                            // click Next whenever you like
    nextBtn.disabled = false;
    nextBtn.textContent = 'Next round';
    return;
  }
  nextBtn.disabled = true;                       // you are through, they are not
  nextBtn.textContent = d.waiting_on.length
    ? 'Waiting for ' + d.waiting_on.join(', ')
    : 'Waiting…';
}

function showModes(show) {
  sheet.classList.toggle('show', show);
  document.getElementById('startBtn').hidden = show;
  document.querySelectorAll('.mode').forEach(function (b) { b.hidden = false; });
  backBtn.before(opts);          // park it back at the end of the sheet
  opts.innerHTML = '';
  opts.hidden = true;
  backBtn.hidden = true;
  joinForm.hidden = true;
  joinErr.textContent = '';
  shareEl.hidden = true;
  diffEl.hidden = true;
  areaPick.hidden = true;
  multiSection.hidden = false;
}

// the two mode cards do double duty: they pick the settings for a solo game,
// or for a multiplayer one when Create was clicked first
document.querySelectorAll('#solo .mode').forEach(function (btn) {
  btn.onclick = function () {
    const m = btn.dataset.mode;
    // keep the chosen card, drop the other, and slot the lengths right under it
    document.querySelectorAll('#solo .mode').forEach(function (b) { b.hidden = b !== btn; });
    btn.after(opts);
    opts.innerHTML = '';
    opts.hidden = false;
    LENGTHS[m].forEach(function (n) {
      const b = document.createElement('button');
      b.textContent = m === 'time' ? n + ' min' : n + ' rounds';
      b.onclick = function () { beginGame(m, n); };
      opts.appendChild(b);
    });
    backBtn.hidden = false;
  };
});

document.getElementById('createBtn').onclick = createGame;

document.getElementById('joinBtn').onclick = function () {
  joinForm.hidden = false;
  codeInput.focus();
};

joinForm.onsubmit = async function (e) {
  e.preventDefault();
  joinErr.textContent = '';
  const d = await post('/api/join', { code: codeInput.value.trim().toUpperCase(),
                                     name: playerName() });
  if (d.error) { joinErr.textContent = d.error; return; }
  enterGame(d);
};

async function createGame() {
  const d = await post('/api/create', { name: playerName() });
  if (d.error) { alert(d.error); return; }
  pendingGame = d;
  document.getElementById('codeText').textContent = d.code;
  sheet.classList.remove('show');
  shareEl.hidden = false;
}

document.getElementById('copyBtn').onclick = function () {
  const btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(document.getElementById('codeText').textContent)
    .then(function () {
      btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
    })
    .catch(function () { btn.textContent = 'Copy failed'; });
};

document.getElementById('playBtn').onclick = function () {
  shareEl.hidden = true;
  enterGame(pendingGame);
};

quitBtn.onclick = async function () {
  if (!confirm('Quit this game? Your score for this match is lost.')) return;
  await post('/api/quit');
  code = null;                  // session is gone, so stop polling the game
  clearInterval(poller);
  endGame();
};

backBtn.onclick = function () { showModes(true); };
document.getElementById('startBtn').onclick = function () { showModes(true); };

const nameInput = document.getElementById('nameInput');
const NAME_KEY = 'geoguesser.name';

try { nameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) { /* private mode */ }

// remembered between games, editable before each one
function playerName() {
  const n = nameInput.value.trim();
  try { n ? localStorage.setItem(NAME_KEY, n) : localStorage.removeItem(NAME_KEY); }
  catch (e) { /* storage unavailable; the name just is not remembered */ }
  return n;
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
  });
}

function setCodeInUrl(c) {
  history.replaceState({}, '', c ? '?g=' + c : location.pathname);
}

// a reload (or someone opening a shared link) lands back in the same game
async function restoreFromUrl() {
  const wanted = (new URLSearchParams(location.search).get('g') || '').toUpperCase();
  if (!wanted) return;
  const st = await fetch('/api/state').then(function (r) { return r.json(); });
  if (st.active && st.code === wanted) return enterGame(st);   // same browser, same game
  const d = await post('/api/join', { code: wanted, name: playerName() });
  if (d.error) { setCodeInUrl(null); return; }
  enterGame(d);
}

restoreFromUrl();

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  }).then(function (r) { return r.json(); });
}

// solo only: choose mode + length, then a difficulty, then (Easy/Medium) an
// area. Difficulty just scopes which countries a round is drawn from -- it
// touches nothing about scoring, the timer, rounds or the result screen.
function beginGame(m, limit) {
  pendingSolo = { mode: m, limit: limit };
  curDiff = null;
  showDifficulty();
}

function showDifficulty() {
  sheet.classList.remove('show');
  shareEl.hidden = true;
  document.getElementById('startBtn').hidden = true;
  areaPick.hidden = true;
  areaSelect.innerHTML = '';
  diffEl.hidden = false;
}

function loadRegions() {
  if (!regionData) {
    regionData = fetch('/api/regions').then(function (r) { return r.json(); });
  }
  return regionData;
}

async function fillAreas(diff) {
  const data = await loadRegions();
  areaSelect.innerHTML = '';
  if (diff === 'medium') {
    areaSelect.appendChild(new Option('Select a continent…', ''));
    data.continents.forEach(function (c) { areaSelect.appendChild(new Option(c, c)); });
  } else {
    areaSelect.appendChild(new Option('Select a country…', ''));
    data.continents.forEach(function (cont) {
      const grp = document.createElement('optgroup');
      grp.label = cont;
      data.countries.forEach(function (c) {
        if (c.continent === cont) grp.appendChild(new Option(c.name, c.code));
      });
      if (grp.children.length) areaSelect.appendChild(grp);
    });
  }
}

document.querySelectorAll('#diffCards .mode').forEach(function (btn) {
  btn.onclick = async function () {
    curDiff = btn.dataset.diff;
    if (curDiff === 'hard') { launchSolo(null); return; }   // Hard: straight in
    await fillAreas(curDiff);
    areaPick.hidden = false;
  };
});

document.getElementById('areaGo').onclick = function () {
  if (areaSelect.value) launchSolo(areaSelect.value);
};

document.getElementById('diffBack').onclick = function () { showModes(true); };

async function launchSolo(area) {
  const body = { mode: pendingSolo.mode, limit: pendingSolo.limit };
  if (curDiff) body.difficulty = curDiff;
  if (area) body.area = area;
  const d = await post('/api/start', body);
  if (d.error) { alert(d.error); return; }
  diffEl.hidden = true;
  enterGame(d);
}

// solo, create and join all land here with the same payload from the server
function enterGame(d) {
  mode = d.mode;
  code = d.code || null;
  finished = false;
  scoreEl.textContent = (d.score || 0).toLocaleString();
  finalEl.hidden = true;
  showModes(false);
  startEl.classList.add('gone');
  document.querySelector('#start video').pause();   // display:none still decodes
  viewer.resize();          // the viewer was hidden behind the start screen

  if (mode === 'time') showTime(d.seconds_left);
  else progressEl.textContent = '0 / ' + d.limit;

  quitBtn.hidden = false;
  board.hidden = !code;
  if (code) {
    document.getElementById('boardCode').textContent = code;
    curRound = d.round || 0;
    setCodeInUrl(code);        // so a reload comes back into this game
    pollSync();
    poller = setInterval(pollSync, 2000);
  }
  newRound();
}

function showTime(secs) {
  progressEl.textContent =
    Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
}

function tick() {
  const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
  showTime(left);
  if (left === 0) endGame();
}

// the server is the authority on the clock; these just mirror it on screen
function startClock(secs) {
  if (mode !== 'time') return;
  clearInterval(ticker);
  deadline = Date.now() + secs * 1000;
  showTime(secs);
  ticker = setInterval(tick, 1000);
}

function stopClock(secs) {
  clearInterval(ticker);
  ticker = null;
  if (mode === 'time' && secs !== undefined) showTime(secs);
}

async function endGame() {
  if (finished) return;              // the clock and the last guess can both fire
  finished = true;
  clearInterval(ticker);
  clearInterval(poller);
  over = true;                       // freeze the map

  if (code) {
    await pollSync();                // one last refresh before we stop
    finalEl.innerHTML = 'Final standings' +
      '<b>' + scoreEl.textContent + '</b>' +
      '<div id="standings">' + boardList.innerHTML + '</div>';
    code = null;
  } else {
    finalEl.innerHTML = 'Final score<b>' + scoreEl.textContent + '</b>';
  }
  board.hidden = true;
  quitBtn.hidden = true;
  setCodeInUrl(null);
  finalEl.hidden = false;
  result.classList.remove('show');
  panel.classList.remove('expanded');
  progressEl.textContent = '';
  startEl.classList.remove('gone');
  document.querySelector('#start video').play();
  showModes(false);
  resize();
}

nextBtn.onclick = async function () {
  if (nextBtn.dataset.last === '1') return endGame();
  if (!code) return newRound();
  nextBtn.disabled = true;
  const d = await post('/api/ready');
  if (d.error) return;
  if (d.round !== curRound) { curRound = d.round; newRound(); }
  else showWait(d);
};
</script>
